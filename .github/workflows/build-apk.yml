
name: Build Couple Money APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p android-project

          unzip -q CoupleMoneyAndroidProject.zip \
            -d android-project

          echo "Isi folder:"
          find android-project -maxdepth 3 -type f | head -50

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find android-project \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle tidak ditemukan"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoupleMoney-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
